
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compare Tool (JSON/Text)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }

    .input-section {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .input-box {
      width: 45%;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    textarea {
      width: 100%;
      height: 150px;
      font-family: monospace;
      padding: 10px;
    }

    .toggle {
      margin-top: 20px;
      font-size: 16px;
    }

    input[type="checkbox"] {
      transform: scale(1.2);
      margin-left: 10px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .box {
      width: 45%;
      text-align: left;
    }

    pre {
      padding: 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid #ccc;
      border-radius: 5px;
      min-height: 300px;
      max-height: 500px;
      overflow: auto;
      font-family: monospace;
    }

    .line {
      display: flex;
    }

    .line-number {
      width: 30px;
      text-align: right;
      margin-right: 10px;
      color: #888;
      user-select: none;
    }

    .line-content {
      flex: 1;
    }

    .same {
      background-color: #d4edda;
    }

    .diff {
      background-color: #f8d7da;
    }
  </style>
</head>
<body>
  <h1>Compare Tool (JSON / Text)</h1>

  <div class="input-section">
    <div class="input-box">
      <label for="leftInput">Left File</label>
      <textarea id="leftInput" placeholder="Paste left input here..."></textarea>
    </div>
    <div class="input-box">
      <label for="rightInput">Right File</label>
      <textarea id="rightInput" placeholder="Paste right input here..."></textarea>
    </div>
  </div>

  <div class="toggle">
    Treat input as JSON?
    <input type="checkbox" id="jsonToggle" />
  </div>

  <button onclick="compareInputs()">Compare</button>

  <div class="container">
    <div class="box">
      <h3>Left File Output</h3>
      <pre id="leftOutput" onscroll="syncScroll('left')"></pre>
    </div>
    <div class="box">
      <h3>Right File Output</h3>
      <pre id="rightOutput" onscroll="syncScroll('right')"></pre>
    </div>
  </div>

  <script>
    function safePrettyJSON(input) {
      try {
        return JSON.stringify(JSON.parse(input), null, 2).split('\n');
      } catch {
        return null;
      }
    }

    function compareLines(lines1, lines2) {
      const max = Math.max(lines1.length, lines2.length);
      const result1 = [], result2 = [];

      for (let i = 0; i < max; i++) {
        const l1 = lines1[i] || '';
        const l2 = lines2[i] || '';
        const cls = l1 === l2 ? 'same' : 'diff';
        const lineNum = `<span class="line-number">${i + 1}</span>`;

        result1.push(`<div class="line ${cls}">${lineNum}<span class="line-content">${l1}</span></div>`);
        result2.push(`<div class="line ${cls}">${lineNum}<span class="line-content">${l2}</span></div>`);
      }

      return [result1.join(''), result2.join('')];
    }

    function compareInputs() {
      const leftRaw = document.getElementById('leftInput').value.trim();
      const rightRaw = document.getElementById('rightInput').value.trim();
      const treatAsJSON = document.getElementById('jsonToggle').checked;

      let leftLines, rightLines;

      if (treatAsJSON) {
        const lJSON = safePrettyJSON(leftRaw);
        const rJSON = safePrettyJSON(rightRaw);

        if (!lJSON || !rJSON) {
          leftLines = ['Invalid JSON'];
          rightLines = ['Invalid JSON'];
        } else {
          leftLines = lJSON;
          rightLines = rJSON;
        }
      } else {
        leftLines = leftRaw.split('\n');
        rightLines = rightRaw.split('\n');
      }

      const [leftResult, rightResult] = compareLines(leftLines, rightLines);
      document.getElementById('leftOutput').innerHTML = leftResult;
      document.getElementById('rightOutput').innerHTML = rightResult;
    }

    function syncScroll(source) {
      const left = document.getElementById('leftOutput');
      const right = document.getElementById('rightOutput');

      if (source === 'left') {
        right.scrollTop = left.scrollTop;
      } else {
        left.scrollTop = right.scrollTop;
      }
    }
  </script>
</body>
</html>
