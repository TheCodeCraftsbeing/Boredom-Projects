
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Utility App</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .section {
      background: #fff;
      padding: 1rem;
      margin: 0.5rem;
      border-radius: 6px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    input, button {
      padding: 0.5rem;
      margin: 0.25rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
    }
    button:hover {
      background-color: #0056b3;
    }
    label {
      display: block;
      margin: 0.25rem 0;
    }
    .timezone-clock {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem;
      background: #f1f1f1;
      border-radius: 4px;
      margin-top: 0.25rem;
    }
    .remove-btn {
      background: red;
      color: #fff;
      border: none;
      padding: 0.25rem 0.5rem;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }
    #popup {
      display: none;
      margin-top: 0.5rem;
      padding: 0.75rem;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 4px;
      color: #856404;
    }
    .tz-link {
      font-size: 0.875rem;
      display: block;
      margin: 0.25rem 0 0.5rem;
      color: #007bff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>🕒 Time Utility App</h1>

  <div class="section">
    <h2>Toggle Features</h2>
    <label><input type="checkbox" checked onchange="toggleSection('timezonesSection', this.checked)"> Timezones</label>
    <label><input type="checkbox" checked onchange="toggleSection('converterSection', this.checked)"> Time Converter</label>
    <label><input type="checkbox" onchange="toggleSection('stopwatchSection', this.checked)"> Stopwatch</label>
    <label><input type="checkbox" onchange="toggleSection('timerSection', this.checked)"> Timer</label>
  </div>

  <div class="section" id="timezonesSection">
    <h3>Timezones</h3>
    <input id="timezoneInput" placeholder="e.g. Asia/Kolkata">
    <a class="tz-link" href="https://en.wikipedia.org/wiki/List_of_tz_database_time_zones" target="_blank">Refer this list of timezones</a>
    <button onclick="addTimezone()">Add</button>
    <div id="timezoneList"></div>
  </div>

  <div class="section" id="converterSection">
    <h3>Time Converter</h3>
    <label>Start (IST): <input type="datetime-local" id="startTime"></label>
    <label>End (optional): <input type="datetime-local" id="endTime"></label>
    <button onclick="convertTimeRange()">Convert</button>
    <div id="convertedTimes"></div>
  </div>

  <div class="section" id="stopwatchSection" style="display:none">
    <h3>Stopwatch</h3>
    <div id="stopwatch">00:00:00</div>
    <button onclick="startStopwatch()">Start</button>
    <button onclick="pauseStopwatch()">Pause</button>
    <button onclick="resetStopwatch()">Reset</button>
  </div>

  <div class="section" id="timerSection" style="display:none">
    <h3>Timer</h3>
    <input id="timerInput" type="number" placeholder="Minutes" min="1">
    <button onclick="startTimer()">Start</button>
    <div id="timer">00:00</div>
    <div id="popup">⏰ Time's up! Reminder: Take a break!</div>
  </div>

  <script>
    const timezones = [];

    function toggleSection(id, visible) {
      const el = document.getElementById(id);
      if (el) el.style.display = visible ? 'block' : 'none';
    }

    function updateClocks() {
      const now = new Date();
      const list = document.getElementById("timezoneList");
      list.innerHTML = "";
      timezones.forEach(tz => {
        const options = {
          timeZone: tz,
          weekday: 'short', year: 'numeric', month: 'short', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        };
        const t = now.toLocaleString('en-US', options);
        const div = document.createElement("div");
        div.className = "timezone-clock";
        div.innerHTML = `<span>${tz}: ${t}</span><button class='remove-btn' onclick="removeTimezone('${tz}')">X</button>`;
        list.appendChild(div);
      });
    }

    function addTimezone() {
      const input = document.getElementById("timezoneInput");
      const tz = input.value.trim();
      if (tz && !timezones.includes(tz)) {
        try {
          Intl.DateTimeFormat(undefined, { timeZone: tz });
          timezones.push(tz);
          input.value = "";
          updateClocks();
        } catch {
          alert("Invalid timezone format. Use 'Area/City' like 'America/New_York'");
        }
      }
    }

    function removeTimezone(tz) {
      const i = timezones.indexOf(tz);
      if (i !== -1) timezones.splice(i, 1);
      updateClocks();
    }

    function convertTimeRange() {
      const startVal = document.getElementById("startTime").value;
      const endVal = document.getElementById("endTime").value;
      const output = document.getElementById("convertedTimes");
      output.innerHTML = "";
      if (!startVal) return output.innerText = "Please enter a valid start time.";

      const start = new Date(startVal);
      const end = endVal ? new Date(endVal) : null;
      const opts = { weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false, day: '2-digit', month: 'short' };

      timezones.forEach(tz => {
        try {
          const startStr = start.toLocaleString('en-US', { timeZone: tz, ...opts });
          const endStr = end ? ` to ${end.toLocaleString('en-US', { timeZone: tz, ...opts })}` : "";
          const div = document.createElement("div");
          div.innerText = `${tz}: ${startStr}${endStr}`;
          output.appendChild(div);
        } catch {
          output.innerHTML += `<div>${tz}: Invalid timezone</div>`;
        }
      });
    }

    window.onload = () => {
      ["America/New_York", "UTC"].forEach(tz => {
        try { Intl.DateTimeFormat(undefined, { timeZone: tz }); timezones.push(tz); } catch {}
      });
      updateClocks();
    };

    setInterval(updateClocks, 1000);

    let stopwatchTime = 0, stopwatchInterval;
    const formatTime = t => `${String(Math.floor(t / 3600)).padStart(2, '0')}:${String(Math.floor((t % 3600) / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
    function startStopwatch() {
      if (!stopwatchInterval) stopwatchInterval = setInterval(() => {
        stopwatchTime++;
        document.getElementById("stopwatch").innerText = formatTime(stopwatchTime);
      }, 1000);
    }
    function pauseStopwatch() { clearInterval(stopwatchInterval); stopwatchInterval = null; }
    function resetStopwatch() { pauseStopwatch(); stopwatchTime = 0; document.getElementById("stopwatch").innerText = "00:00:00"; }

    let timerInterval;
    function startTimer() {
      const mins = parseInt(document.getElementById("timerInput").value);
      if (isNaN(mins) || mins <= 0) return alert("Enter a valid number of minutes");
      let timeLeft = mins * 60;
      document.getElementById("popup").style.display = "none";
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        document.getElementById("timer").innerText = `${m}:${s}`;
        timeLeft--;
        if (timeLeft < 0) {
          clearInterval(timerInterval);
          document.getElementById("popup").style.display = "block";
        }
      }, 1000);
    }
  </script>
</body>
</html>
